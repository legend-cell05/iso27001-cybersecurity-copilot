[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iso27001-cybersecurity-copilot"
version = "1.0.0"
description = "Deterministic ISO/IEC 27001:2022 compliance engine: control catalogue as data, risk register with residual risk, evidence freshness, gap findings, Statement of Applicability and an audit-readiness gate (synthetic data)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ayman Bara", email = "aymanbara2005@gmail.com" }]
keywords = ["iso27001", "grc", "compliance", "risk-management", "information-security"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "PyYAML>=6.0,<7.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<2.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[project.urls]
Repository = "https://github.com/legend-cell05/iso27001-cybersecurity-copilot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "PTH", "RUF"]
ignore = [
    "E501",    # the formatter owns line length
    "B008",    # FastAPI dependency injection puts calls in defaults
]

[tool.ruff.lint.per-file-ignores]
# The exception names end in Error only where they are errors; a blocked gate
# is not one, and renaming it to satisfy a lint rule would say it was.
"src/sentinel/exceptions.py" = ["N818"]
"tests/**" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
files = ["src"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
# No python_version pin: it applies that grammar to the installed stubs, which
# are written for whatever interpreter CI is actually running.

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a live PostgreSQL (set SENTINEL_RUN_INTEGRATION=1)",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["src/sentinel"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
